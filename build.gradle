plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex('net\\.runelite.*')
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.mockito:mockito-core:4.11.0'
}

group = 'dev.orbonly'
version = '1.0.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.named('jar') {
	from('runelite-plugin.properties')
}

tasks.named('test') {
	useJUnit()
	dependsOn tasks.named('jar')
	inputs.files('LICENSE', 'THIRD-PARTY-NOTICES.md')
	inputs.file(tasks.named('jar').flatMap { it.archiveFile })
	systemProperty 'java.awt.headless', 'true'
	systemProperty 'orbonly.jar', tasks.named('jar').get().archiveFile.get().asFile.absolutePath
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.orbonly.OrbOnlyDev'
	jvmArgs '-ea'
	args '--developer-mode'
}
